<!DOCTYPE html>
<html>
    <head>
        <style>
            html {
                font-family: Arial, sans-serif;
                background-color: blueviolet;
            }

            .card-container {
                display: flex;
                justify-content: space-around;
                align-items: center;
                height: 200px;
                border: 2px solid black;
                padding: 20px;
                width: 300px;
                background-color: white;
            }

            img.card {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                background-color: lightgray;
            }

            .text {
                display: flex;
                flex-direction: column;
                justify-content: center;
                margin-left: 20px;
            }
            .name {
                font-size: 20px;
                font-weight: bold;
            }
            .role {
                font-size: 16px;
                color: gray;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0px;
            }

        </style>
    </head>
    <body>
        <div class="card-container">
            <img src="" class="card">
            <div class="text">
                <div class="name">Jane Smith</div>
                <div class="role">Product Manager</div>
            </div>
        </div>
    </body>
</html>
