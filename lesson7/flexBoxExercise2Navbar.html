<!DOCTYPE html>
<html>
    <head>

                display: flex;
                background-color: rgb(10, 66, 123);
                color: white;
                justify-content: space-between;
                padding: 20px;
            }

            .logo {
                font-size: 25px;
            }

            .navbar-items {
                display: flex;
                gap: 20px;
                align-items: center;
            }

        <nav class="navbar">
            <div class="logo">My Company</div>
            <div class="navbar-items">
                <div class="nav-item">Products</div>
                <div class="nav-item">Services</div>
                <div class="nav-item">Careers</div>
                <div class="nav-item">Shop</div>
            </div>
        </nav>
        <div class="content">
            <h1>Welcome to My Company</h1>
            <p>Your one-stop solution for all your needs.</p>
        </div>
    </body>
</html>
