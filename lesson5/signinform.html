<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
        <div class="signin-form">
            <h1>Sign in</h1>
            <p>Please enter your email to sign in</p>
            <div>
                <label for="email">Email</label><br/>
                <input type="text" id="email" name="email"/>
                
                <div class="signin-continue">Continue</div>                
            </div>
            <p class="on-top-text">or</p>
            <hr>
            <div>
                <div class="button-outline"><img src="https://img.icons8.com/?size=100&id=118468&format=png&color=000000"/> Continue with Facebook</div>
                <div class="button-outline"><img src="https://img.icons8.com/ios/50/google-logo--v1.png" />Continue with Apple</div>
                <div class="button-outline"><img src="https://img.icons8.com/ios/50/google-logo--v1.png" />Continue with Twitter</div>
                <div class="button-outline"><img src="https://img.icons8.com/ios/50/google-logo--v1.png" />Continue with BBA</div>
            </div>
            <p>Don't have an account? <a href="#">Create one</a></p>
            <p><a href="#">Need help?</a></p>
        </div>
    </body>
</html>
