<!DOCTYPE html>
<html>
    <head>
        <style>
            .box {
                width: 400px;
                height: 200px;
                background-color: lightblue;    
                margin: 20px;
            }

            .container {
                display: flex;
            }

            .side-box {
                width: 50px;
                height: 200px;
                background-color: lightgreen;
            }

            @media (max-width: 900px) {
                .container { 
                    flex-direction: column;
                }

                .box {
                    background-color: lightcoral;
                }
            }

            @media (max-width: 800px) {
                .box {
                    border: 5px solid black;
                }
            }

            @media (max-width: 800px) and (min-width: 500px) {
                html {
                    background-color: red
                }
            }

            @media (max-width: 1000px) {
                .side-box {
                    display: none;
                }
            }
        </style>

    </head>
    <body>
        <h1>Responsive Demo with boxes side by side and stacked on top</h1>
        <div class="container">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box side-box"></div>
        </div>

    </body>
</html>
